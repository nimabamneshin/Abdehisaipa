<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>ثبت آبدهی خودرو</title>
<style>
:root{--bg:#fff8f2;--card:#fff;--tx:#2a1d14;--mu:#8c7766;--pr:#f26a1b;--prd:#d4540c;--bd:#f4dcc9;--rd:#d92d20;--ok:#d4540c;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 Tahoma,"Segoe UI",system-ui,sans-serif}
.hd{background:linear-gradient(135deg,#ff9a5c,#f26a1b);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px #f26a1b55}
.hd img{width:54px;height:58px;object-fit:contain;background:#fff;border-radius:14px;padding:6px}
.hd b{display:block;font-size:18px}.hd span{font-size:12px;opacity:.92}
#app{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 14px;color:var(--prd)}h2{font-size:16px;margin:18px 0 8px;color:var(--prd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #f26a1b14}
.big{display:block;width:100%;padding:20px;margin-bottom:12px;font:inherit;font-size:19px;font-weight:700;border:0;border-radius:18px;color:#fff;background:linear-gradient(135deg,#ff9a5c,#f26a1b);box-shadow:0 6px 16px #f26a1b55;cursor:pointer}
.big.w,.big.g{background:#fff;color:var(--prd);border:2px solid var(--pr);box-shadow:none}
label{display:block;font-weight:700;margin:14px 0 6px;color:#6b3a1a}
input,textarea,select,.dbtn{width:100%;padding:13px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);font:inherit}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 3px #f26a1b22}
.dbtn{text-align:right;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:90px}
.ch{padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);font:inherit;text-align:center;cursor:pointer}
.ch.on{background:linear-gradient(135deg,#ff9a5c,#f26a1b);color:#fff;border-color:var(--pr);box-shadow:0 3px 10px #f26a1b44}
.sv{width:100%;touch-action:manipulation;border:1.5px dashed var(--pr);border-radius:12px;background:#fffaf6}
.sm{padding:8px 14px;border:1.5px solid var(--pr);border-radius:10px;background:#fff;color:var(--prd);font:inherit;cursor:pointer}
.hint{color:var(--mu);font-size:13px}
.rl{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#ff1a1a;box-shadow:0 0 8px 2px #ff1a1a;animation:rb 1s infinite alternate;pointer-events:none}@keyframes rb{from{opacity:.3}to{opacity:1}}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:10px}.st div{background:#fff4ea;border-radius:14px;padding:10px 4px}.st b{display:block;font-size:24px;color:var(--prd);line-height:1.3}.st span{font-size:12px;color:var(--mu)}.bar{height:10px;background:#fde3cf;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9a5c,#f26a1b);border-radius:6px}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:25;padding:14px}
.cal{background:#fff;border-radius:18px;padding:14px;width:100%;max-width:360px}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.g7 b{font-size:12px;color:var(--mu)}.g7 button{padding:9px 0;border:0;border-radius:8px;background:#fff4ea;color:var(--tx);font:inherit}
.g7 button.on{background:var(--pr);color:#fff}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--prd);color:#fff;padding:12px 20px;border-radius:24px;z-index:30;box-shadow:0 6px 18px #0004;max-width:92%;text-align:center}
.eb{position:sticky;top:6px;z-index:20;background:var(--rd);color:#fff;padding:12px 14px;border-radius:12px;margin-bottom:12px;font-weight:700;box-shadow:0 6px 16px #d92d2055}
.err{color:var(--rd);font-weight:bold}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border:1px solid #efd3bf;padding:6px;text-align:center;white-space:nowrap}th{background:#fde3cf;color:#5a2a0c}
textarea.t{height:110px;direction:ltr;font-size:12px}
@media print{.np,.hd{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:0;box-shadow:none}td,th{border-color:#000}}
</style></head><body><div class="hd np"><img alt=""><div><b>ثبت آبدهی خودرو</b><span>کنترل کیفیت شاور</span></div></div><div id="app"></div>
